name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Full cross-browser run overnight, when nobody is waiting on it.
    - cron: '0 2 * * *'
  workflow_dispatch:

# A new push supersedes the run in flight for the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # saucedemo.com publishes these on its own home page. A client deployment
  # reads them from repository secrets instead.
  STANDARD_USERNAME: standard_user
  STANDARD_PASSWORD: secret_sauce
  PROBLEM_USERNAME: problem_user
  PROBLEM_PASSWORD: secret_sauce

jobs:
  static:
    name: Types, lint, format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check

  smoke:
    name: Smoke
    needs: static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Restore browsers
        id: browser-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      # No --with-deps: the runner image already carries Playwright's system
      # libraries, and the apt step it triggers fails intermittently against
      # the Google Chrome repository.
      - name: Install browsers
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - run: npm run test:smoke
        env:
          CI: true

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: smoke-report
          path: playwright-report/
          retention-days: 7

  full:
    name: Full (shard ${{ matrix.shard }}/4)
    needs: smoke
    # Skipped on pull requests: smoke gates those, the full run covers main
    # and the nightly schedule.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Firefox and WebKit need system libraries the bare runner does not carry.
    # The official image ships all three browsers and their dependencies, so
    # there is no apt step and nothing to download.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

      - name: Run shard ${{ matrix.shard }} of 4
        run: npx playwright test --shard=${{ matrix.shard }}/4 --reporter=blob
        env:
          CI: true

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report/
          retention-days: 1

  report:
    name: Merged report
    needs: full
    # Runs even when a shard fails: a red run is when the report matters most.
    if: ${{ !cancelled() && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

      - uses: actions/download-artifact@v8
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      - run: npx playwright merge-reports --reporter=html ./all-blob-reports

      - uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
